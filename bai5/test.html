<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <div>
            <p>Mobile phone or email</p>
            <input type="text" placeholder="Mobile or email">
        </div>

        <div>
            <p>Password</p>
            <input type="password" placeholder="password">
        </div>

        <div>
            <p>Birthday</p>
            <input list="month" placeholder="month">
            <datalist id="month">
                <option value="1">1</option>
                <option value="2">2</option>
            </datalist>
            <input list="day" placeholder="day">
            <datalist id="day">
                <option value="1">1</option>
                <option value="2">2</option>
            </datalist>
            <input list="year" placeholder="year">
            <datalist id="year">
                <option value="2000">2000</option>
                <option value="20001">2001</option>
            </datalist>
        </div>
        <div>
            <p>Name</p>
            <input type="text" placeholder="name">
        </div>
        <div>
            <p>Username</p>
            <input type="text" placeholder="Username">
        </div>
        <div>
            <input type="submit">
        </div>
    </form>
</body>
</html>
