<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bai 4</title>
</head>
<body>
    <h1>Form tao thong tin</h1>
    <form>
        <!-- input neu ko truyen type thi mac dinh la text  -->
        <div><p>Ho va ten:</p> 
            <input type="text" name="ten">
        </div>
        <div><p>Gioi thieu ban than:</p>
            <textarea></textarea>
        </div>
        <div>
            <p>Email</p>
            <input type="email" name="email">
        </div>
        <div>
            <!-- So dau tien: 0
            So thu 2: 9,3,6,8
            8 So con lai: 0-9   -->
            <p>So dien thoai</p>
            <input name="Sodt" type="tel" placeholder="dang so" 
            required pattern="([0]{1})([9,3,6,8]{1})([0-9]{8}))">
        </div>
        <div>
            <p><b>Gioi tinh</b></p>
            <input type="radio" name="gioitinh" value="male">NAM<br>
            <input type="radio" name="gioitinh" value="female">NU<br>
        </div>
         <div>
            <p><b>So thich</b></p>
            Game: <input type="checkbox" name="sothich" value="game"><br>
            Music: <input type="checkbox" name="sothich" value="music"><br>
            Sport: <input type="checkbox" name="sothich" value="sport">
        </div>
        <div>
            <p>Trinh duyet web hay su dung</p>  
            <input list="browsers">
            <datalist id="browsers">
                <option value="Internet exploser"></option>
                <option value="Firefox"></option>
                <option value="CocCoc"></option>
            </datalist>
            <select name="browsers">
                <option value="Internet exploser">Internet exploser</option>
                <option value="Firefox">Firefox</option>
                <option value="CocCoc">CocCoc</option>
            </select>
        </div>
        <div>
            0<input type="range" id="a" value="50">100
        </div>
        <div>
            <input type="submit">
            <button>click</button>
            <input type="reset">
        </div>
        <div>
        <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/zP-lS45qUhs?si=pV2Ut_OCHUkAsMmH" 
        title="YouTube video player" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin" 
        allowfullscreen></iframe>
        </div>
    </form>
    <MARQUEE>
        <img src="cchung.jpg" >
    </MARQUEE>
    <audio>
        <source src="1.mp4" type="audio/mp4">
    </audio>
    <video>
        <source src="1.mp4" type="video/mp4">
    </video>
</body>
</html>
